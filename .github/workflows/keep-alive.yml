# Pings the deployed backend so it stays warm. Render's free plan sleeps a
# service after 15 minutes without traffic, so this runs every 10 minutes.
# GitHub may delay scheduled runs; an external monitor (e.g. UptimeRobot)
# hitting /health every 5 minutes is the more reliable option.
#
# Setup: GitHub repo -> Settings -> Secrets and variables -> Actions ->
# Variables -> New repository variable:
#   BACKEND_URL = https://<your-service>.onrender.com   (no trailing slash)
# Until BACKEND_URL is set, the job is skipped instead of failing.

name: Keep backend awake

on:
  schedule:
    # Every 10 minutes.
    - cron: "*/10 * * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.BACKEND_URL != '' }}
    steps:
      - name: Ping /health
        # A cold backend can take a minute or two to wake up, hence the
        # long timeout and retries.
        run: |
          curl --fail --silent --show-error \
            --max-time 180 --retry 3 --retry-delay 30 --retry-all-errors \
            "${{ vars.BACKEND_URL }}/health"
